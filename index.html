    <script src="class/drawable-objects.class.js"></script>
    <script src="class/movable-objects.class.js"></script>
    <script src="class/background.class.js"></script>
    <script src="class/level.class.js"></script>
    <script src="class/keyboard.clas.js"></script>
    <script src="class/sharkie.class.js"></script>
    <script src="class/bubble.class.js"></script>
    <script src="class/enemies.class.js"></script>
    <script src="class/puffer-fish.class.js"></script>
    <script src="class/jelly-fish.class.js"></script>

    <script src="class/bubblebar.class.js"></script>
    <script src="class/endbossbar.class.js"></script>
    <script src="class/coin.class.js"></script>
    <script src="class/poisonbottle.class.js"></script>

  </head>
  <body onload="init()">
    <header></header>

    <main>
      <article class="main-content">
        <h1 class="game-title">Sharkie</h1>
        <div class="canvas-wrapper" id="canvas_wrapper">
          <div class="background-layer"></div>
          <canvas id="canvas" width="720" height="460"></canvas>
        </div>
        
        <section class="wrapper-absolute startscreen">
          <button class="btn--main" id="game_start">
            <img class="btn--img btn--start" src="assets/images/6.Botones/Start/3.png" alt="Start" />
          </button>
          <button class="btn--main">Description</button>
        </section>

        <section class="wrapper-absolute hidden" id="again_btn">
          <button id="try_again" class="btn--secondary">
            <img class="btn--img" src="assets/images/6.Botones/Try again/Recurso 17.png" alt="Try again" />
          </button>
        </section>
      </article>
      <aside class="flex-center mar-m">
        <button class="btn--main btn--fullscreen">
          <img class="btn--img" src="assets/images/6.Botones/Full Screen/Mesa de trabajo 6.png" alt="Fullscreen" />
        </button>
      </aside>
    </main>
    <footer>
      <p>das ist ein test</p>
    </footer>
  </body>
