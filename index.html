<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="assets/images/favicon/hai.svg" type="image/x-icon" />
    <title>Sharkie</title>

    <script src="class/drawable-objects.class.js"></script>
    <script src="class/movable-objects.class.js"></script>
    <script src="class/background.class.js"></script>
    <script src="class/level.class.js"></script>
    <script src="class/keyboard.clas.js"></script>
    <script src="class/sharkie.class.js"></script>
    <script src="class/bubble.class.js"></script>
    <script src="class/enemies.class.js"></script>
    <script src="class/puffer-fish.class.js"></script>
    <script src="class/jelly-fish.class.js"></script>
    <script src="class/endboss.class.js"></script>
    <script src="class/statusbar.class.js"></script>
    <script src="class/healthbar.class.js"></script>
    <script src="class/coinbar.class.js"></script>
    <script src="class/bubblebar.class.js"></script>
    <script src="class/endbossbar.class.js"></script>
    <script src="class/coin.class.js"></script>
    <script src="class/poisonbottle.class.js"></script>
    <script src="class/endscreen.class.js"></script>
    <script src="class/world.class.js"></script>

    <script src="level/level1.js"></script>
    <script src="scripts/sound.js"></script>
    <script src="scripts/game.js"></script>

    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/buttons.css" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body onload="init()">
    <header></header>

    <main>
      <article class="main-content">
        <h1 class="game-title">Sharkie</h1>
        <div class="canvas-wrapper" id="canvas_wrapper">
          <div class="background-layer"></div>
          <canvas id="canvas" width="720" height="460"></canvas>
        </div>

        <section class="wrapper-absolute start-section">
          <button class="btn--main btn--start" id="game_start">
            <img class="btn--img btn--start" src="assets/images/6.Botones/Start/3.png" alt="Start" />
          </button>
        </section>

        <section class="wrapper-absolute wrapper-subarea">
          <button class="btn--dialog">Description</button>
          <button class="btn--dialog" id="key_descriptions">Key Descriptions</button>
          <button class="btn--dialog">Sound</button>
        </section>

        <section class="wrapper-absolute hidden" id="again_btn">
          <button id="try_again" class="btn--secondary">
            <img class="btn--img" src="assets/images/6.Botones/Try again/Recurso 17.png" alt="Try again" />
          </button>
        </section>
      </article>

      <dialog class="dialog" id="key_dialog">
        <div class="dialog__content">
          <div class="dialog__header">
            <h2 class="dialog__title">Key Descriptions</h2>
            <button class="btn--close" id="key_dialog_close" aria-label="Close">&times;</button>
          </div>

          <ul class="dialog__list">
            <li class="dialog__row">
              <span class="dialog__keys">
                <kbd class="key">W</kbd>
                <kbd class="key">A</kbd>
                <kbd class="key">S</kbd>
                <kbd class="key">D</kbd>
              </span>
              <span class="dialog__action">Move</span>
            </li>
            <li class="dialog__row">
              <span class="dialog__keys">
                <kbd class="key">E</kbd>
              </span>
              <span class="dialog__action">Fin Slap</span>
            </li>
            <li class="dialog__row">
              <span class="dialog__keys">
                <kbd class="key key--wide">Space</kbd>
              </span>
              <span class="dialog__action">Bubble Attack</span>
            </li>
          </ul>
        </div>
      </dialog>
    </main>
    <footer>
      <aside class="flex-center mar-m" id="fullscreen_aside">
        <button class="btn--main btn--fullscreen hidden" id="btn_fullscreen">
          <img class="btn--img" src="assets/images/6.Botones/Full Screen/Mesa de trabajo 6.png" alt="Fullscreen" />
        </button>
      </aside>
    </footer>
  </body>
</html>
